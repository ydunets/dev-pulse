name: Collect

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEVPULSE_DB: data/devpulse.db
      DEVPULSE_REPOS: Effect-TS/effect
      DEVPULSE_OWNERS: ydunets
      GITHUB_TOKEN: ${{ secrets.DEVPULSE_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm collect

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/devpulse.db
          git diff --cached --quiet && exit 0
          git commit -m "Collect project data"
          git pull --rebase
          git push
